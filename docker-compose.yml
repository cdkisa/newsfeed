services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: newsfeed
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${DB_PASSWORD:-postgres}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    restart: unless-stopped

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgresql+asyncpg://postgres:${DB_PASSWORD:-postgres}@db:5432/newsfeed
      LLM_PROVIDER: ${LLM_PROVIDER:-gemini/gemini-2.0-flash}
      LLM_API_KEY: ${LLM_API_KEY:-}
      ADMIN_API_KEY: ${ADMIN_API_KEY:-change-me-in-production}
      YOUTUBE_API_KEY: ${YOUTUBE_API_KEY:-}
      TWITTER_BEARER_TOKEN: ${TWITTER_BEARER_TOKEN:-}
      GITHUB_TOKEN: ${GITHUB_TOKEN:-}
      INGEST_SCHEDULE: ${INGEST_SCHEDULE:-0 6 * * *}
    depends_on:
      - db
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
    ports:
      - "8080:80"
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  pgdata:
